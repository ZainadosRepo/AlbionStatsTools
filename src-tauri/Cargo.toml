[package]
name = "albion-stats"
version = "0.6.4"
description = "Real-time Albion Online combat meter, session tracker, dungeon & gathering telemetry, and crafting calculator"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[lib]
name = "albion_stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
albion-core = { path = "../crates/albion-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
